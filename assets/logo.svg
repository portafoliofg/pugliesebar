<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="logoTitle">
  <title id="logoTitle">San Pugliese Bar</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#7a2233"/>
      <stop offset="100%" stop-color="#3d0f16"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9cf94"/>
      <stop offset="50%" stop-color="#b6883f"/>
      <stop offset="100%" stop-color="#e9cf94"/>
    </linearGradient>
    <path id="arcTop" d="M 34,120 A 86,86 0 0 1 206,120"/>
  </defs>

  <circle cx="120" cy="120" r="118" fill="url(#ring)"/>
  <circle cx="120" cy="120" r="108" fill="url(#bg)"/>
  <circle cx="120" cy="120" r="108" fill="none" stroke="#e9cf94" stroke-width="1.5" opacity="0.5"/>

  <!-- silhouette bust -->
  <g opacity="0.9">
    <ellipse cx="120" cy="112" rx="30" ry="34" fill="#e9cf94" opacity="0.16"/>
    <path d="M120,84 c18,0 30,15 28,34 c-1,10 -6,17 -6,17 c14,6 34,16 34,40 l0,14 -112,0 0,-14 c0,-24 20,-34 34,-40 c0,0 -5,-7 -6,-17 c-2,-19 10,-34 28,-34 z"
          fill="#efe6d0" opacity="0.14" stroke="#e9cf94" stroke-width="1.2" stroke-opacity="0.55"/>
    <circle cx="108" cy="102" r="3" fill="#e9cf94" opacity="0.5"/>
    <circle cx="132" cy="102" r="3" fill="#e9cf94" opacity="0.5"/>
    <path d="M100,116 q20,10 40,0" stroke="#e9cf94" stroke-width="1.2" fill="none" opacity="0.4"/>
  </g>

  <text font-family="'Playfair Display', Georgia, serif" font-size="17" letter-spacing="4" fill="#e9cf94">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">SAN PUGLIESE</textPath>
  </text>

  <text x="120" y="196" font-family="'Dancing Script', cursive" font-size="30" fill="#e3a9b4" text-anchor="middle" transform="rotate(-4 120 196)">Pugliese</text>
  <text x="120" y="212" font-family="'Jost', sans-serif" font-size="11" letter-spacing="3" fill="#e9cf94" text-anchor="middle" opacity="0.85">ROTISERÍA &amp; BAR</text>
</svg>
