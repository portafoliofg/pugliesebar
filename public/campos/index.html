<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis campos · Tablero Agro</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="campos.css">
<script src="config.js"></script>
</head>
<body>
<div class="app">
  <header class="barra">
    <h1>Mis campos</h1>
    <div class="resumen" id="resumen" aria-live="polite"></div>
    <div class="acciones">
      <button class="btn" id="btn-gh" type="button"><span class="estado-gh" id="estado-gh"></span>GitHub</button>
      <a class="btn" id="btn-general" href="general.html" target="_blank" rel="noopener">📋 Reporte general</a>
      <button class="btn" id="btn-alertas" type="button">🔔 Alertas</button>
      <button class="btn btn-peligro-claro oculto" id="btn-borrar-todo" type="button">🗑 Eliminar todos</button>
      <button class="btn btn-1" id="btn-cargar" type="button">＋ Cargar KML/KMZ</button>
      <input type="file" id="archivo" class="oculto" accept=".kml,.kmz,application/vnd.google-earth.kml+xml,application/vnd.google-earth.kmz" multiple>
    </div>
  </header>
  <div class="cuerpo" style="position:relative">
    <div id="mapa" role="region" aria-label="Mapa satelital de los campos"></div>
    <aside class="panel" id="panel" aria-label="Lista y detalle de campos"></aside>
    <div class="cargando oculto" id="cargando"><div><div class="spinner"></div><span id="cargando-txt">Cargando…</span></div></div>
  </div>
</div>
<div class="avisos" id="avisos"></div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="kml.js"></script>
<script src="pronostico.js"></script>
<script src="github.js"></script>
<script src="ndvi.js"></script>
<script src="campos.js"></script>
</body>
</html>
