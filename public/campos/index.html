<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis campos · Sammartino</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;700;800&display=swap"></noscript>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="campos.css">
<script src="config.js"></script>
</head>
<body>
<div class="app">
  <header class="barra">
    <h1><img class="logo-mini" src="../favicon.svg" alt="Sammartino" width="30" height="30">Mis campos</h1>
    <div class="resumen" id="resumen" aria-live="polite"></div>
    <span class="chip rol-badge oculto" id="rol-badge"></span>
    <div class="acciones">
      <details class="menu-mas" id="menu-reportes">
        <summary class="btn">📊 Reportes</summary>
        <div class="menu-mas-lista">
          <a class="btn" id="btn-general" href="general.html" target="_blank" rel="noopener">📋 Reporte general</a>
          <a class="btn" id="btn-cuaderno" href="cuaderno.html" target="_blank" rel="noopener">📚 Cuaderno de campo</a>
          <a class="btn solo-dueno" id="btn-margen" href="margen.html" target="_blank" rel="noopener">💵 Margen bruto</a>
          <a class="btn solo-dueno" id="btn-ventas" href="comercial.html" target="_blank" rel="noopener">🤝 Comercialización</a>
        </div>
      </details>
      <button class="btn solo-carga" id="btn-labores" type="button">📒 Labores</button>
      <button class="btn solo-carga" id="btn-lluvia" type="button">🌧️ Lluvia</button>
      <button class="btn btn-1 solo-dueno" id="btn-cargar" type="button">＋ Cargar KML/KMZ</button>
      <details class="menu-mas" id="menu-mas">
        <summary class="btn"><span class="estado-gh" id="estado-gh"></span>⚙️ Más</summary>
        <div class="menu-mas-lista">
          <button class="btn solo-carga" id="btn-importar-labores" type="button">📥 Importar labores (Excel/CSV)</button>
          <button class="btn" id="btn-gh" type="button">🔗 GitHub</button>
          <button class="btn solo-dueno" id="btn-alertas" type="button">🔔 Alertas por WhatsApp</button>
          <button class="btn solo-dueno" id="btn-accesos" type="button">👥 Accesos (socio, contratista)</button>
          <button class="btn btn-peligro-claro oculto solo-dueno" id="btn-borrar-todo" type="button">🗑 Eliminar todos</button>
        </div>
      </details>
      <input type="file" id="archivo" class="oculto" accept=".kml,.kmz,application/vnd.google-earth.kml+xml,application/vnd.google-earth.kmz" multiple>
    </div>
  </header>
  <div class="cuerpo" style="position:relative">
    <div id="mapa" role="region" aria-label="Mapa satelital de los campos"></div>
    <aside class="panel" id="panel" aria-label="Lista y detalle de campos"></aside>
    <div class="cargando oculto" id="cargando"><div><div class="spinner"></div><span id="cargando-txt">Cargando…</span></div></div>
  </div>
</div>
<div class="avisos" id="avisos"></div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="kml.js"></script>
<script src="ensamble.js"></script>
<script src="pronostico.js"></script>
<script src="github.js"></script>
<script src="planilla.js"></script>
<script src="ndvi.js"></script>
<script src="agua.js"></script>
<script src="equipo.js"></script>
<script src="campos.js"></script>
</body>
</html>
