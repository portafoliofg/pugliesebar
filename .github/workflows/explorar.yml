name: explorar-temporal
on:
  push:
    branches: [claude/wonderful-turing-m1cm2l]
    paths: [scripts/explorar-historia.mjs, .github/workflows/explorar.yml]
jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "24" }
      - run: npm ci --omit=dev || npm install
      - run: node scripts/explorar-historia.mjs
